<button class="close" id="historyClose">×</button></div><div class="history-list" id="historyList"></div></div></div><div class="modal" id="modal"><div class="dialog"><h3 id="modalTitle">Añadir movimiento</h3><div class="field"><label>Fecha</label><input type="date" id="dateInput"></div><div class="field"><label>Concepto / notas</label><textarea id="noteInput"></textarea></div><div class="row"><div class="field"><label>Horas extra (+)</label><input type="number" min="0" step="0.25" id="plusInput" value="0"></div><div class="field"><label>Horas menos (-)</label><input type="number" min="0" step="0.25" id="minusInput" value="0"></div></div><div class="hint" id="preview"></div><div class="actions"><button class="btn danger" id="deleteBtn" style="visibility:hidden">Eliminar</button><div class="right-actions"><button class="btn secondary" id="cancelBtn">Cancelar</button><button class="btn" id="saveBtn">Guardar</button></div></div></div></div>
<script>const KEY='controlHorasGuimi.v1';const seed=[['2026-07-28','Arribada a les 7:00',.5,0],['2026-07-29','',0,1],['2026-07-30','Arribada a les 7:00',.5,0],['2026-08-03','arribada 7:00',.5,0],['2026-08-04','arribada 7:00',.5,0],['2026-08-05','arribada 7:00 / sortida 15:15',.5,0],['2026-08-06','arribada 6:45',.5,1],['2026-08-07','arribada 7:00',.5,0],['2026-08-10','arribada 7:00',.5,0],['2026-08-12','',0,2],['2026-08-13','arribada 7:00',.5,.5],['2026-08-14','arribada 7:00',.5,.5],['2026-08-25','',.25,.25],['2026-08-26','',.5,0],['2026-08-27','',.5,0],['2026-08-28','',.5,1.5],['2026-08-31','',.5,0]].map((x,i)=>({id:'seed-'+i,date:x[0],note:x[1],plus:x[2],minus:x[3]}));let entries=load(),cursor=new Date(),editingId=null;const $=id=>document.getElementById(id);function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)?v:seed}catch{return seed}}function persist(){localStorage.setItem(KEY,JSON.stringify(entries))}function localISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function parseISO(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}function balance(e){return Number(e.plus||0)-Number(e.minus||0)}function fmt(n){const v=Math.round(n*100)/100;return `${v>0?'+':''}${v.toLocaleString('es-ES',{maximumFractionDigits:2})} h`}function cls(n){return n>0?'pos':n<0?'neg':'zero'}function sum(){return entries.reduce((a,e)=>a+balance(e),0)}function renderMetric(){const el=$('totalBalance'),card=$('balanceCard'),sticker=$('positiveSticker'),n=sum();el.textContent=fmt(n);el.className='big '+cls(n);card.style.background=n>0?'linear-gradient(135deg,#f3fff8,#e5f7ed)':n<0?'linear-gradient(135deg,#fff5f4,#ffe8e6)':'linear-gradient(135deg,#f7f9fc,#eef2f6)';card.classList.toggle('has-sticker',n>0);sticker.style.display=n>0?'block':'none'}function entriesForDate(s){return entries.filter(e=>e.date===s)}function renderCalendar(){const y=cursor.getFullYear(),m=cursor.getMonth();$('monthTitle').textContent=new Intl.DateTimeFormat('es-ES',{month:'long',year:'numeric'}).format(new Date(y,m,1));const first=new Date(y,m,1),offset=(first.getDay()+6)%7,start=new Date(y,m,1-offset),today=localISO(new Date()),box=$('calendar');box.innerHTML='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=localISO(d),daily=entriesForDate(iso),val=daily.reduce((a,e)=>a+balance(e),0),div=document.createElement('div');let extra=daily.length?(val>0?' positive':val<0?' negative':' neutral-entry'):'';div.className='day'+(d.getMonth()!==m?' muted':'')+(iso===today?' today':'')+extra;div.innerHTML=`<div class="num">${d.getDate()}</div>${daily.length?'<span class="dot"></span>':''}${daily.length?`<div class="badge ${cls(val)}">${fmt(val)}</div>`:''}`;div.onclick=()=>openModal(iso,daily.length===1?daily[0].id:null);box.appendChild(div)}}function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function renderHistory(){const list=$('historyList'),sorted=[...entries].sort((a,b)=>b.date.localeCompare(a.date));list.innerHTML='';sorted.forEach(e=>{const d=parseISO(e.date),div=document.createElement('div');div.className='item';div.innerHTML=`<div class="item-top"><span>${new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)}</span><span class="${cls(balance(e))}">${fmt(balance(e))}</span></div><div class="item-note">${esc(e.note)||`+${e.plus||0} h / -${e.minus||0} h`}</div>`;div.onclick=()=>{$('historyModal').classList.remove('show');openModal(e.date,e.id)};list.appendChild(div)})}function render(){renderMetric();renderCalendar();renderHistory()}function openModal(date=localISO(new Date()),id=null){editingId=id;const e=id?entries.find(x=>x.id===id):null;$('modalTitle').textContent=e?'Editar movimiento':'Añadir movimiento';$('dateInput').value=e?.date||date;$('noteInput').value=e?.note||'';$('plusInput').value=e?.plus??0;$('minusInput').value=e?.minus??0;$('deleteBtn').style.visibility=e?'visible':'hidden';updatePreview();$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show');editingId=null}function updatePreview(){const n=(Number($('plusInput').value)||0)-(Number($('minusInput').value)||0);$('preview').textContent='Balance del movimiento: '+fmt(n);$('preview').className='hint '+cls(n)}function save(){const date=$('dateInput').value;if(!date)return alert('Selecciona una fecha.');const plus=Math.max(0,Number($('plusInput').value)||0),minus=Math.max(0,Number($('minusInput').value)||0),note=$('noteInput').value.trim();if(plus===0&&minus===0&&!note)return alert('Introduce horas o una nota.');if(editingId)Object.assign(entries.find(x=>x.id===editingId),{date,note,plus,minus});else entries.push({id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),date,note,plus,minus});persist();cursor=parseISO(date);closeModal();render()}function remove(){if(editingId&&confirm('¿Eliminar este movimiento?')){entries=entries.filter(e=>e.id!==editingId);persist();closeModal();render()}}$('addBtn').onclick=()=>openModal();$('historyBtn').onclick=()=>$('historyModal').classList.add('show');$('historyClose').onclick=()=>$('historyModal').classList.remove('show');$('prevBtn').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);render()};$('nextBtn').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);render()};$('todayBtn').onclick=()=>{cursor=new Date();render()};$('cancelBtn').onclick=closeModal;$('saveBtn').onclick=save;$('deleteBtn').onclick=remove;$('plusInput').oninput=$('minusInput').oninput=updatePreview;render();</script></body></html>
