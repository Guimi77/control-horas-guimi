<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control Horas Guimi</title>
<style>:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#eaf0f7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#e7eef7 0,#f4f7fb 45%,#eef3f8 100%);min-height:100vh}.app{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;background:#183153;color:#fff;padding:18px 20px;border-radius:18px;box-shadow:0 8px 24px #18315320}.title h1{margin:0;font-size:28px}.title p{margin:4px 0 0;color:#c8d7ea}.balance-card{background:linear-gradient(135deg,#f3fff8,#e5f7ed);border:1px solid #b7dfc8;border-radius:16px;padding:20px 22px;margin:20px 0;box-shadow:0 5px 18px #08744314;display:flex;align-items:center;justify-content:space-between}.balance-card small{color:#436253;font-weight:800;letter-spacing:.3px}.big{font-size:36px;font-weight:850}.pos{color:#087443}.neg{color:#b42318}.zero{color:#475467}.toolbar,.nav,.right-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:#0f6fbf;color:#fff;box-shadow:0 2px 6px #0f6fbf24}.btn:hover{filter:brightness(.96)}.btn.secondary{background:#f7fbff;color:#183153;border:1px solid #b8c8da;box-shadow:none}.btn.icon{width:42px;padding:10px 0;font-size:19px}.btn.danger{background:#b42318}.panel{background:#f9fbfd;border:1px solid #cfd9e5;border-radius:18px;padding:16px;box-shadow:0 6px 20px #1831530d}.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.calendar-head h2{margin:0;text-transform:capitalize;color:#183153}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week div{text-align:center;color:#56708d;font-size:12px;font-weight:800;padding:6px}.day{min-height:88px;border:1px solid #d9e2ec;border-radius:12px;padding:8px;background:#fff;cursor:pointer;position:relative;transition:.15s ease}.day:hover{border-color:#8fb2d5;transform:translateY(-1px);box-shadow:0 4px 10px #18315310}.day.muted{opacity:.38;background:#f4f6f9}.day.today{outline:2px solid #0f6fbf;background:#eef7ff}.day.positive{background:#edf9f2;border-color:#b9dfc8}.day.negative{background:#fff0ef;border-color:#efc0bc}.day.neutral-entry{background:#fff9e8;border-color:#eadcae}.num{font-weight:800}.badge{margin-top:18px;font-size:12px;font-weight:800}.dot{width:7px;height:7px;border-radius:50%;background:#0f6fbf;position:absolute;top:9px;right:9px}.positive .dot{background:#1b8a55}.negative .dot{background:#c53a30}.neutral-entry .dot{background:#b08516}.history-list{display:flex;flex-direction:column;gap:8px;max-height:65vh;overflow:auto;margin-top:16px}.item{border:1px solid #d9e2ec;border-radius:12px;padding:10px;cursor:pointer;background:#f9fbfd}.item:hover{background:#eef5fb}.item-top{display:flex;justify-content:space-between;gap:8px;font-weight:800}.item-note{font-size:13px;color:#667085;margin-top:4px}.modal{display:none;position:fixed;inset:0;background:#10233c99;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.show{display:flex}.dialog{width:min(480px,100%);background:#f9fbfd;border-radius:18px;padding:20px;box-shadow:0 18px 60px #10233c40}.dialog.wide{width:min(620px,100%)}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog h3{margin:0;color:#183153}.close{border:0;background:transparent;font-size:26px;cursor:pointer;color:#56708d}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px;color:#344a62}.field input,.field textarea{width:100%;padding:11px;border:1px solid #b9c8d8;border-radius:10px;font:inherit;background:#fff}.field input:focus,.field textarea:focus{outline:2px solid #c9e4f8;border-color:#0f6fbf}.field textarea{min-height:80px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.hint{font-size:12px;color:#667085}.empty{text-align:center;color:#98a2b3;padding:30px}@media(max-width:800px){.day{min-height:68px}.app{padding:12px}.top{padding:15px}}@media(max-width:480px){.balance-card{padding:15px}.big{font-size:28px}.day{min-height:58px}.calendar-head h2{font-size:18px}}</style></head><body>
<div class="app"><div class="top"><div class="title"><h1>Control de horas</h1><p>Guimi · calendario perpetuo</p></div><div class="toolbar"><button class="btn" id="addBtn">+ Añadir</button><button class="btn secondary icon" id="historyBtn" title="Histórico" aria-label="Histórico">☰</button></div></div><div class="balance-card" id="balanceCard"><small>SALDO ACUMULADO</small><div class="big" id="totalBalance">0 h</div></div><section class="panel"><div class="calendar-head"><div class="nav"><button class="btn secondary" id="prevBtn">‹</button><button class="btn secondary" id="todayBtn">Hoy</button></div><h2 id="monthTitle"></h2><div class="nav"><button class="btn secondary" id="nextBtn">›</button></div></div><div class="week"><div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div></div><div class="grid" id="calendar"></div></section></div>
<div class="modal" id="historyModal"><div class="dialog wide"><div class="dialog-head"><h3>Histórico</h3><button class="close" id="historyClose">×</button></div><div class="history-list" id="historyList"></div></div></div>
<div class="modal" id="modal"><div class="dialog"><h3 id="modalTitle">Añadir movimiento</h3><div class="field"><label>Fecha</label><input type="date" id="dateInput"></div><div class="field"><label>Concepto / notas</label><textarea id="noteInput" placeholder="Ej. Arribada 7:00"></textarea></div><div class="row"><div class="field"><label>Horas extra (+)</label><input type="number" min="0" step="0.25" id="plusInput" value="0"></div><div class="field"><label>Horas menos (-)</label><input type="number" min="0" step="0.25" id="minusInput" value="0"></div></div><div class="hint" id="preview">Balance del movimiento: 0 h</div><div class="actions"><button class="btn danger" id="deleteBtn" style="visibility:hidden">Eliminar</button><div class="right-actions"><button class="btn secondary" id="cancelBtn">Cancelar</button><button class="btn" id="saveBtn">Guardar</button></div></div></div></div>
<script>const KEY='controlHorasGuimi.v1';const seed=[['2026-07-28','Arribada a les 7:00',.5,0],['2026-07-29','',0,1],['2026-07-30','Arribada a les 7:00',.5,0],['2026-08-03','arribada 7:00',.5,0],['2026-08-04','arribada 7:00',.5,0],['2026-08-05','arribada 7:00 / sortida 15:15',.5,0],['2026-08-06','arribada 6:45',.5,1],['2026-08-07','arribada 7:00',.5,0],['2026-08-10','arribada 7:00',.5,0],['2026-08-12','',0,2],['2026-08-13','arribada 7:00',.5,.5],['2026-08-14','arribada 7:00',.5,.5],['2026-08-25','',.25,.25],['2026-08-26','',.5,0],['2026-08-27','',.5,0],['2026-08-28','',.5,1.5],['2026-08-31','',.5,0]].map((x,i)=>({id:'seed-'+i,date:x[0],note:x[1],plus:x[2],minus:x[3]}));let entries=load(),cursor=new Date(),editingId=null;const $=id=>document.getElementById(id);function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)?v:seed}catch{return seed}}function persist(){localStorage.setItem(KEY,JSON.stringify(entries))}function localISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function parseISO(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}function balance(e){return Number(e.plus||0)-Number(e.minus||0)}function fmt(n){const v=Math.round(n*100)/100;return `${v>0?'+':''}${v.toLocaleString('es-ES',{maximumFractionDigits:2})} h`}function cls(n){return n>0?'pos':n<0?'neg':'zero'}function sum(){return entries.reduce((a,e)=>a+balance(e),0)}function renderMetric(){const el=$('totalBalance'),card=$('balanceCard'),n=sum();el.textContent=fmt(n);el.className='big '+cls(n);card.style.background=n>0?'linear-gradient(135deg,#f3fff8,#e5f7ed)':n<0?'linear-gradient(135deg,#fff5f4,#ffe8e6)':'linear-gradient(135deg,#f7f9fc,#eef2f6)';card.style.borderColor=n>0?'#b7dfc8':n<0?'#efc0bc':'#cfd9e5'}function entriesForDate(s){return entries.filter(e=>e.date===s)}function renderCalendar(){const y=cursor.getFullYear(),m=cursor.getMonth();$('monthTitle').textContent=new Intl.DateTimeFormat('es-ES',{month:'long',year:'numeric'}).format(new Date(y,m,1));const first=new Date(y,m,1),offset=(first.getDay()+6)%7,start=new Date(y,m,1-offset),today=localISO(new Date()),box=$('calendar');box.innerHTML='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=localISO(d),daily=entriesForDate(iso),val=daily.reduce((a,e)=>a+balance(e),0),div=document.createElement('div');let extra='';if(daily.length)extra=val>0?' positive':val<0?' negative':' neutral-entry';div.className='day'+(d.getMonth()!==m?' muted':'')+(iso===today?' today':'')+extra;div.innerHTML=`<div class="num">${d.getDate()}</div>${daily.length?'<span class="dot"></span>':''}${daily.length?`<div class="badge ${cls(val)}">${fmt(val)}</div>`:''}`;div.onclick=()=>openModal(iso,daily.length===1?daily[0].id:null);box.appendChild(div)}}function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function renderHistory(){const list=$('historyList'),sorted=[...entries].sort((a,b)=>b.date.localeCompare(a.date));if(!sorted.length){list.innerHTML='<div class="empty">Aún no hay movimientos</div>';return}list.innerHTML='';sorted.forEach(e=>{const d=parseISO(e.date),div=document.createElement('div');div.className='item';div.innerHTML=`<div class="item-top"><span>${new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)}</span><span class="${cls(balance(e))}">${fmt(balance(e))}</span></div><div class="item-note">${esc(e.note)||`+${e.plus||0} h / -${e.minus||0} h`}</div>`;div.onclick=()=>{$('historyModal').classList.remove('show');openModal(e.date,e.id)};list.appendChild(div)})}function render(){renderMetric();renderCalendar();renderHistory()}function openModal(date=localISO(new Date()),id=null){editingId=id;const e=id?entries.find(x=>x.id===id):null;$('modalTitle').textContent=e?'Editar movimiento':'Añadir movimiento';$('dateInput').value=e?.date||date;$('noteInput').value=e?.note||'';$('plusInput').value=e?.plus??0;$('minusInput').value=e?.minus??0;$('deleteBtn').style.visibility=e?'visible':'hidden';updatePreview();$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show');editingId=null}function updatePreview(){const n=(Number($('plusInput').value)||0)-(Number($('minusInput').value)||0);$('preview').textContent='Balance del movimiento: '+fmt(n);$('preview').className='hint '+cls(n)}function save(){const date=$('dateInput').value;if(!date)return alert('Selecciona una fecha.');const plus=Math.max(0,Number($('plusInput').value)||0),minus=Math.max(0,Number($('minusInput').value)||0),note=$('noteInput').value.trim();if(plus===0&&minus===0&&!note)return alert('Introduce horas o una nota.');if(editingId)Object.assign(entries.find(x=>x.id===editingId),{date,note,plus,minus});else entries.push({id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),date,note,plus,minus});persist();cursor=parseISO(date);closeModal();render()}function remove(){if(editingId&&confirm('¿Eliminar este movimiento?')){entries=entries.filter(e=>e.id!==editingId);persist();closeModal();render()}}$('addBtn').onclick=()=>openModal();$('historyBtn').onclick=()=>$('historyModal').classList.add('show');$('historyClose').onclick=()=>$('historyModal').classList.remove('show');$('historyModal').onclick=e=>{if(e.target===$('historyModal'))$('historyModal').classList.remove('show')};$('prevBtn').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);render()};$('nextBtn').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);render()};$('todayBtn').onclick=()=>{cursor=new Date();render()};$('cancelBtn').onclick=closeModal;$('saveBtn').onclick=save;$('deleteBtn').onclick=remove;$('plusInput').oninput=$('minusInput').oninput=updatePreview;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};render();</script></body></html>
